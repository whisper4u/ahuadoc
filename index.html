            height: 300px;
            border-radius: 12px;
            border: 2px solid #eee;
            object-fit: contain;
        }
        .qr-label {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }
        .btn {

            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 0;

            margin-top: 24px;

            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
